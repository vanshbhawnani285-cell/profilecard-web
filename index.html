<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        body {
            background: white;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            min-height: 100vh;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
        }

        .profile-card {
            width: 320px;              /* wider card (was an invalid "400" with no unit) */
            flex-shrink: 0;
            background-color: rgb(232, 237, 240);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            margin-bottom: 10px;
        }

        .cover {
            height: 150px;
            background-color: rgb(2, 2, 83);
            position: relative;
        }

        /* Developer icon in place of the photo */
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 70px;
            transform: translateX(-50%);
            border: 4px solid white;
            outline: 2px solid rgb(190, 200, 207);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-picture svg {
            width: 62px;
            height: 62px;
        }

        .profile-info {
            text-align: center;
            padding: 40px 20px 25px;
        }

        .profile-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .profile-info p {
            color: #666;
            margin: 6px 0;
            font-size: 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 22px;
        }

        .social-icons a {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 24px;
            text-decoration: none;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* Hover effect on icons */
        .social-icons a:hover {
            transform: translateY(-6px) scale(1.15);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }

        .fa-facebook {
            color: #1877F2;
        }

        /* "color" can't take a gradient, so paint the gradient as a background
           and clip it to the shape of the icon */
        .fa-instagram {
            background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .fa-github {
            color: #6e40c9;
        }

        .fa-behance {
            color: #1769ff;
        }

        .profile-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .profile-buttons button {
            padding: 9px 25px;
            border-radius: 50px;
            background: rgb(2, 2, 83);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .profile-buttons button:hover {
            background: rgb(5, 5, 20);
            color: white;
            transition: 0.3s;
        }

        .stats {
            border-top: 1px solid #ddd;
            padding: 18px 10px;
            display: flex;
            justify-content: space-around;
        }

        .stats-div {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #555;
            font-size: 14px;
        }

        .stats i {
            font-size: 17px;
        }

        .box {
            display: flex;
            height: 600px;
            margin: 0px;
            margin-bottom: 100px;
        }

        .left-bar {
            height: 550px;
            margin-right: 25px;
            margin-top: 60px;
            width: 3%;
            background: rgb(2, 2, 83);
            border-radius: 20px;
        }

        .big-text {
            flex: 1;
        }

        .big-text h1 {
            font-size: clamp(60px, 9vw, 130px);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            line-height: 1.0;
            font-weight: 800;
            color: rgb(2, 2, 83);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="left-bar"></div>
            <div class="big-text">
                <h1>Profile Card <br>
                    Ui/UX <br>
                    Design</h1>
            </div>
        </div>
        <div class="profile-card">
            <div class="cover">
                <div class="profile-picture">
                    <!-- Developer icon: laptop with code brackets -->
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer">
                        <rect x="9" y="12" width="46" height="32" rx="4" fill="#020253"/>
                        <rect x="13" y="16" width="38" height="24" rx="2" fill="#1d3fbf"/>
                        <path d="M26 22 L19 28 L26 34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M38 22 L45 28 L38 34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M35 20 L29 36" fill="none" stroke="#feda75" stroke-width="3" stroke-linecap="round"/>
                        <path d="M4 48 H60 L56 54 H8 Z" fill="#8a94a6"/>
                    </svg>
                </div>
            </div>
            <div class="profile-info">
                <h2>Website Developer</h2>
                <p>Dezyne Ecole College</p>
                <p>BCA 1st year</p>
                <div class="social-icons">
                    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
                </div>
                <div class="profile-buttons">
                    <button>Subscribe</button>
                    <button>Manage</button>
                </div>
                <div class="stats">
                    <div>
                        <i class="fa-regular fa-heart"></i>
                        <span>69.1k</span>
                        <i class="fa-regular fa-comment"></i>
                        <span>20k</span>
                        <i class="fa-solid fa-share"></i>
                        <span>12k</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
