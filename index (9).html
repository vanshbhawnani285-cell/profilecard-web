<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontweb/frame/css/all.min">
    <style>
        .con {
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            
        }
        .left,.right,.center {
           height: 100%;
            
        }
        .left{
            width: 30%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            font-size: 55px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .center,h1 {
            margin-left: 20px;
        }
        .right{
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            height: 30%;
            
        }
        .bottom{
            height: 30%;
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
       .cirle{
        height: 125px;
        width: 125x;
        border: 5px solid navy;
        border-radius: 50%;
        position: absolute;
        top: 80px;
        right: 240px;
        display: flex;
        justify-content: center;
        align-items: center;
       } 
       img{ 
        height: 100%;
        width: 100%;
        border-radius: 50%;
        border: 2px solid white;

       }
       .bottom>h1,icons,button{
        text-align: center;
        font-size: 20px;
        margin-bottom: 20px;

       }
       .icon{
        display: flex;
        justify-content: center;
        gap: 10px;
        }
        .button{
            height: 50%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        }
        .button1{
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 20px;
            color: white;
            text-align: center;
            line-height: 20px;    

        }
        .fa-facebook{color: blue;}
        .fa-githubP{color: violet;}
        .fa-linkdin{color: skyblue;}
        .fa-instagram{
            background: linear-gradient(red,pink,yellow);
            color: transparent;
            background-clip: text;
        }

        </style>

</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="Capture.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne Ecole College</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook"></i>
                         <i class="fa fa-brands fa-instagram"></i> 
                          <i class="fa fa-brands fa-linkdin"></i> 
                           <i class="fa fa-brands fa-Github"></i>
                            <i class="fa fa-brands fa-Behance"></i>
                    </div>
                    <div class="button">
                        <div class="button1">Subscribe</div>
                        <div class="button2">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-brands fa-solid fa-heart></i>60.4k
                        <i class="fa fa-brands fa-solid fa-comment></i>20k
                        <i class="fa fa-brands fa-solid fa-share fa-horizontal></i>12.6
                    </div>
                </div> 
            </div>
        </div>
    </div>
    
</body>
</html>
